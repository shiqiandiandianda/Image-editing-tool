[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frame-repair-backend"
version = "0.1.0"
description = "Deterministic backend core for reviewable frame repair jobs"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "pillow>=10,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "mypy>=1.11,<2", "ruff>=0.6,<1"]

[tool.setuptools.packages.find]
where = ["src"]
