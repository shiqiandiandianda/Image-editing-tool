[project]
name = "image-editing-tool"
version = "0.1.0"
description = "Deterministic backend primitives for localized comic image repair"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pillow>=11,<13",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "httpx>=0.28,<1",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
